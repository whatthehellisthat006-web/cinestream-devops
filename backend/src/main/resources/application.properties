# CineStream Spring Boot Configuration
server.port=${SERVER_PORT:8081}

# Spring Datasource Configuration (externalized for local dev & Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cinestream_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# Logging
logging.level.com.cinestream=INFO
logging.level.org.springframework.web=INFO

# Cloudflare R2 Configuration (supplied via environment variables, never hardcoded)
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:cinestream-videos}
cloudflare.r2.endpoint=${R2_ENDPOINT:}

# JWT Configuration (supplied via JWT_SECRET env var in staging/prod)
app.jwt.secret=${JWT_SECRET:local_dev_only_jwt_secret_key_change_in_production_minimum_32_chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring Boot Actuator (Healthcheck & Version Info for Docker & Staging)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=CineStream
info.app.version=${APP_VERSION:dev}
