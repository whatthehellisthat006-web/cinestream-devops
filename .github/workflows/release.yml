# ==============================================================================
# CineStream - Release, Immutable GHCR Publish & Auto-Deploy (Atelier 5)
# - Triggered automatically on semantic version tags: vX.Y.Z (e.g. v1.0.0)
# - Publishes immutable Docker images to GitHub Container Registry (GHCR)
# - Refuses to overwrite an already-published version tag (immutability)
# - Automatically deploys the published version to staging & verifies health (+2 bonus)
# ==============================================================================

name: Release - Publish & Deploy Staging

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    name: Pre-Release Tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run validation & unit tests
        run: bash scripts/validate.sh

  publish:
    name: Publish Immutable Images (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Extract semantic version
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce immutability (fail if tag already exists in GHCR)
        run: |
          OWNER_LOWER=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')
          if docker manifest inspect "${{ env.REGISTRY }}/${OWNER_LOWER}/cinestream-backend:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: Image tag ${{ steps.meta.outputs.version }} already exists in GHCR! Published versions are immutable."
            exit 1
          fi
          echo "Tag ${{ steps.meta.outputs.version }} is new. Proceeding with publish."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image (${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cinestream-backend:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Frontend image (${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cinestream-frontend:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-staging:
    name: Auto-Deploy Staging & Healthcheck (${{ needs.publish.outputs.version }})
    runs-on: ubuntu-latest
    needs: publish
    environment: staging

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy immutable version ${{ needs.publish.outputs.version }} to staging
        env:
          APP_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          bash scripts/deploy-staging.sh "${APP_VERSION}"

      - name: Verify staging containers & health endpoints
        run: |
          docker compose -f docker-compose.staging.yml ps
          curl -fsS http://localhost:8081/actuator/health
          echo ""
          curl -fsS http://localhost:4200/ >/dev/null
          echo "Staging deployment ${{ needs.publish.outputs.version }} verified healthy!"

      - name: Tear down ephemeral runner stack
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
