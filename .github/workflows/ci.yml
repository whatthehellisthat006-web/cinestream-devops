# ==============================================================================
# CineStream - Continuous Integration Pipeline (Atelier 5)
# - Triggered on Pull Requests (and pushes) to main
# - Matrix test job across Java 17 and Java 21 (+1 bonus)
# - Uploads Maven Surefire XML test reports as artifacts (even on failure)
# - Builds Backend & Frontend Docker images ONLY after tests succeed (needs)
# ==============================================================================

name: CI - Test and Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Validate & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run Bash validation script (Atelier 2)
        run: bash scripts/validate.sh

      - name: Run backend unit tests & generate Surefire reports
        working-directory: backend
        run: mvn test -B

      - name: Upload test reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: backend/target/surefire-reports/
          if-no-files-found: error

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: cinestream-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: cinestream-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
